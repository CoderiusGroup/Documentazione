name: Aggiorna Sito Documentazione

on:
  # Parte solo DOPO che "Compila Documenti Typst" ha finito e spinto i PDF.
  # Il vecchio trigger su push di '**/*.pdf' faceva partire i due workflow in
  # parallelo sullo stesso push: entrambi committano su main, e quello piu'
  # lento (la compilazione Typst) si vedeva rifiutare il push.
  workflow_run:
    workflows: ["Compila Documenti Typst"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

# Stesso gruppo di compile_typst.yml: i due non scrivono mai su main insieme.
concurrency:
  group: commit-automatico-refs/heads/main
  cancel-in-progress: false

jobs:
  aggiorna-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Scarica la repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Esegui lo script Python
        run: python .github/update_website.py

      - name: Commit e Push delle modifiche
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: aggiornato index e glossario [skip ci]"
          file_pattern: 'website/*'
